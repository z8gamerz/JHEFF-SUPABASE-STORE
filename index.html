<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Sari-Sari POS - Modern Offline POS &amp; Credit Ledger</title>
    <meta name="description" content="A standalone, offline-first PWA POS system for Filipino small businesses, featuring product management, transactions, and customer credit ledger." />
    <meta property="og:title" content="Sari-Sari POS - Modern Offline POS &amp; Credit Ledger" />
    <meta property="og:description" content="A standalone, offline-first PWA POS system for Filipino small businesses, featuring product management, transactions, and customer credit ledger." />
    <meta name="theme-color" content="#ea580c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SariSari POS" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <script>
      (function() {
        window.addEventListener('error', function(e) {
          if (e && (
            (e.message && (e.message.indexOf("reading 'send'") !== -1 || e.message.indexOf('WebSocket') !== -1)) ||
            (e.filename && e.filename.indexOf('@vite/client') !== -1)
          )) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var msg = e && e.reason ? (e.reason.message || String(e.reason)) : '';
          if (
            msg.indexOf("reading 'send'") !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('@vite/client') !== -1 ||
            msg.indexOf('transport was disconnected') !== -1
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
